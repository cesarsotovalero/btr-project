<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BTR - SEB Risk Assessment Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
  <!-- SEB Green Design System theme wrapper — provides design tokens -->
  <gds-theme color-scheme="light">

    <!-- Top navigation bar -->
    <header class="topbar">
      <div class="topbar-brand">
        <svg class="topbar-logo" viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="16" r="14" fill="#60cd18"/><text x="16" y="21" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="SEB SansSerif, Arial, sans-serif">B</text></svg>
        <span class="topbar-title">BTR - SEB Risk Assessment Platform</span>
      </div>
      <nav class="topbar-nav" id="main-nav">
        <a href="#/" class="nav-link" data-page="home">
          <span class="nav-icon"><i class="fa-solid fa-folder-open"></i></span> Cases
        </a>
        <a href="#/references" class="nav-link" data-page="references">
          <span class="nav-icon"><i class="fa-solid fa-book"></i></span> References
        </a>
      </nav>
      <div class="topbar-actions">
        <div id="user-menu-container"></div>
      </div>
    </header>

    <!-- Main content area -->
    <main id="app" class="app-main">
      <div class="page-loading">
        <gds-spinner></gds-spinner>
        <p>Loading…</p>
      </div>
    </main>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container"></div>

  </gds-theme>

  <!-- Green Design System bundle (IIFE — must load before app scripts) -->
  <script src="/js/green.bundle.js"></script>
  <!-- Apache ECharts bundle (tree-shaken, SEB theme) -->
  <script src="/js/echarts.bundle.js" defer></script>

  <!-- App scripts -->
  <script src="/js/auth.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <script src="/js/pages/login.js" defer></script>
  <script src="/js/pages/case-list.js" defer></script>
  <script src="/js/pages/case-detail.js" defer></script>
  <script src="/js/pages/document-intelligence.js" defer></script>
  <script src="/js/pages/compliance-dashboard.js" defer></script>
  <script src="/js/pages/risk-workspace.js" defer></script>
  <script src="/js/pages/audit-trace.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
