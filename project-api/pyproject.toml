[project]
name = "btr-api"
version = "0.1.0"
description = "Backend API for BTR"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "aiofiles>=23.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    # Document parsing
    "pypdf>=5.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "pdf2image>=1.17.0",
    # AI / Agents
    "google-genai>=1.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mkdocs>=1.6.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.21.0",
    # Seed data generation
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
